name: Orange CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/e2e-*']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: pip install fastapi==0.110.1 motor==3.3.1 pydantic==2.12.5 python-dotenv==1.2.1 python-jose==3.5.0 passlib==1.7.4 requests==2.32.5 email-validator==2.3.0 pytest==9.0.2 httpx==0.27.2
      - name: Compile backend
        run: python -m py_compile server.py
      - name: Run backend smoke tests
        run: pytest -q test_api_smoke.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Build frontend
        env:
          REACT_APP_BACKEND_URL: http://localhost:8000
        run: npm run build
